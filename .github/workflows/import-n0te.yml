name: Import validated N0TE baseline

on:
  push:
    branches:
      - agent/n0te-song-ready-baseline
    paths:
      - '.n0te-import/**'
      - 'IMPORT_N0TE_PAYLOAD.py'

permissions:
  contents: write

jobs:
  import-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v4
        with:
          ref: agent/n0te-song-ready-baseline
          fetch-depth: 0

      - name: Reconstruct verified N0TE source
        run: python3 IMPORT_N0TE_PAYLOAD.py

      - name: Run canonical validation
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -q
          python3 -m compileall -q app INSTALL_N0TE_ABLETON_AI.py
          bash -n INSTALL_N0TE_MAC.command
          bash -n START_N0TE_ABLETON_AI.command
          bash -n UNINSTALL_N0TE_ABLETON_AI.command
          python3 -m json.tool VERSION.json >/dev/null
          python3 -m json.tool FEATURE_MATRIX.json >/dev/null
          python3 -m json.tool N0TE_CONTEXT_PACK.json >/dev/null

      - name: Remove migration scaffolding
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .n0te-import IMPORT_N0TE_PAYLOAD.py
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type f -name '*.pyc' -delete

      - name: Commit validated baseline
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
          else
            git commit -m 'Import validated N0TE v1.2.4 Song-Ready baseline'
            git push origin HEAD:agent/n0te-song-ready-baseline
          fi
