name: Finalize canonical N0TE baseline

on:
  push:
    branches:
      - agent/n0te-clean-promote
    paths:
      - '.bootstrap/**'
      - '.github/workflows/bootstrap-finalize.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout clean staging branch
        uses: actions/checkout@v5
        with:
          ref: agent/n0te-clean-promote
          fetch-depth: 0

      - name: Reconstruct exact canonical files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/static tests
          : > app/static/index.html
          for f in .bootstrap/ui/ui-*.b64; do base64 --decode "$f" >> app/static/index.html; done
          : > tests/test_core.py
          for f in .bootstrap/core/core-*.b64; do base64 --decode "$f" >> tests/test_core.py; done
          : > tests/test_python_installer.py
          for f in .bootstrap/installer/installer-*.b64; do base64 --decode "$f" >> tests/test_python_installer.py; done

          check_blob() {
            path="$1" expected="$2"
            actual="$(git hash-object "$path")"
            if [ "$actual" != "$expected" ]; then
              echo "Blob mismatch for $path: expected $expected, got $actual" >&2
              exit 1
            fi
          }
          check_blob app/static/index.html d5bdfb5ab142517b7f4f63fc0af98922d9a074c3
          check_blob tests/test_core.py 6dbcadc9d95944ecba358a53e8446c92cc00c9b7
          check_blob tests/test_mac_bootstrap.py efb3471cba8de87fe2cd1fc98e9d6ac5d90caece
          check_blob tests/test_python_installer.py 4dc58387de0bc0d5c08b3d7bd4a3b2a1816f0a9e

      - name: Run canonical validation
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -v
          python3 -m compileall -q app INSTALL_N0TE_ABLETON_AI.py
          bash -n INSTALL_N0TE_MAC.command
          bash -n START_N0TE_ABLETON_AI.command
          bash -n UNINSTALL_N0TE_ABLETON_AI.command
          python3 -m json.tool VERSION.json >/dev/null
          python3 -m json.tool FEATURE_MATRIX.json >/dev/null
          python3 -m json.tool N0TE_CONTEXT_PACK.json >/dev/null
          python3 - <<'PY'
          from pathlib import Path
          import re
          import subprocess
          import tempfile

          html = Path('app/static/index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', html, flags=re.S | re.I)
          inline = '\n'.join(scripts).strip()
          if inline:
              with tempfile.NamedTemporaryFile('w', suffix='.js', encoding='utf-8', delete=False) as fh:
                  fh.write(inline)
                  tmp = fh.name
              subprocess.run(['node', '--check', tmp], check=True)
          PY

      - name: Remove bootstrap and publish normal source tree
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .bootstrap .github/workflows/bootstrap-finalize.yml
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type f -name '*.pyc' -delete
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Finalize canonical N0TE v1.2.4 baseline'
          git push origin HEAD:agent/n0te-clean-promote
